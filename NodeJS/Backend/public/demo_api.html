<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title> Websocket test </title>
  <style>
    body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 120%;}

    #deviceForm { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
    #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
    #input:focus { outline: none; }

    #messages { list-style-type: none; margin: 0; padding: 0; }
    #messages > li { padding: 0.5rem 1rem; }
    #messages > li:nth-child(odd) { background: #efefef; }

  </style>

  </head>
  <body>
    <ul id="messages"></ul>
    <hr style="border-style: double">

    <h2 style = "white-space: pre-wrap;">    Rest API test:</h2>

      <p style="margin-left: 50px;" >
          <b> api/devices/</b>
          <span style="float:right; margin-right:200px; display: flex; height: 1.8rem;">
            <button type="submit" id="api_devices_request" style="width:7rem">Requiest</button>
          </span>
      </p>  

      <p style="margin-left: 50px;" >
        <b> api/devices/ </b>
        <input id="api_device_id" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">
          <button type="submit" id="api_device_request" style="width:7rem">Requiest</button>
        </span>  
      </p>

      <p style="margin-left: 50px;">
        <b> api/devices/</b>
        <input id="api_module_deviceId" autocomplete="off" size="5" />        
        <b>?</b>
        <b>module_id=</b><input id="api_module_id" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">
          <button type="submit" id="api_module_request" style="width:7rem">Requiest</button>
        </span>
      </p>
 
      <hr style="border-style: dotted">
      <p style="margin-left: 50px;">
        <b> api/params?</b>
        <b>device_id=</b><input id="api_params_deviceId" autocomplete="off" size="5" />
        <b>&module_id=</b><input id="api_params_moduleId" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">
          <button type="submit" id="api_params_request" style="width:7rem">Requiest</button>
        </span>
      </p>

      <p style="margin-left: 50px;">
        <b> api/params/</b>
        <input id="api_param_id" autocomplete="off" size="5" />        
        <b>?</b>
        <b>device_id=</b><input id="api_param_deviceId" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">  
        <button type="submit" id="api_param_request" style="width:7rem">Requiest</button>
        </span>
      </p>

      <p style="margin-left: 50px;">
      <b> api/params/data/</b>
      <input id="api_param_data_id" autocomplete="off" size="5" />        
      <b>?</b>
      <b>device_id=</b><input id="api_param_data_deviceId" autocomplete="off" size="5" />
      <b>&stream=</b><input id="api_param_data_stream" value = "" autocomplete="on" size="5"/>

      <span style="float:right; margin-right: 78px; display: flex; height: 1.8rem;">
        <button type="submit" id="api_param_data_request" style="width:7rem">Requiest</button>
        <button type="submit" id="api_param_data_stop" style="margin-left: 10px; width:7rem;">Stop</button>
      </span>
      </p>

    <hr style="border-style: double">

<script src = "./script_demo_api.js" type = "text/javascript"> </script>
  </body>
</html>
