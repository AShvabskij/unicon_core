<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title> Websocket test </title>
  <style>
    body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    #deviceForm { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
    #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
    #input:focus { outline: none; }

    #messages { list-style-type: none; margin: 0; padding: 0; }
    #messages > li { padding: 0.5rem 1rem; }
    #messages > li:nth-child(odd) { background: #efefef; }

  </style>

  </head>
  <body>
    <ul id="messages"></ul>
    <hr style="border-style: double">

    <h2 style = "white-space: pre-wrap;">    Data model test:</h2>
      <p style="margin-left: 50px;" >
        <b> Load all: </b>
        <span style="float:right; margin-right:200px; display: flex; height: 1.8rem;">
          <button type="submit" id="model_load" style="width:7rem; font-weight: bold">Load</button>
        </span>
      </p>  
      
      <p style="margin-left: 50px;" >
        <b> All devices: </b>
        <span style="float:right; margin-right:200px; display: flex; height: 1.8rem;">
          <button type="submit" id="get_devices" style="width:7rem">Get</button>
        </span>
      </p>  

      <p style="margin-left: 50px;" >
        <b> Device header: id=</b>
        <input id="get_device_id" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">
          <button type="submit" id="get_device_header" style="width:7rem">Get</button>
        </span>  
      </p>

      <p style="margin-left: 50px;">
        <b> Module header: id=</b>
        <input id="get_module_id" autocomplete="off" size="5" />        
        <b>device_id=</b><input id="get_module_deviceId" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">
          <button type="submit" id="get_module_header" style="width:7rem">Get</button>
        </span>
      </p>

      <hr style="border-style: dashed">
      <p style="margin-left: 50px;">
        <b> All params:</b>
        <b>device_id=</b><input id="get_params_deviceId" autocomplete="off" size="5" />
        <b>module_id=</b><input id="get_params_moduleId" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">
          <button type="submit" id="get_params" style="width:7rem">Get</button>
        </span>
      </p>

      <p style="margin-left: 50px;">
        <b> Param header: id=</b>
        <input id="get_param_id" autocomplete="off" size="5" />        
        <b>device_id=</b><input id="get_param_deviceId" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">  
        <button type="submit" id="get_param_header" style="width:7rem">Get</button>
        </span>
      </p>

      <p style="margin-left: 50px;">
        <b> Param data: id=</b>
        <input id="get_param_data_id" autocomplete="off" size="5" />        
        <b>device_id=</b><input id="get_param_data_deviceId" autocomplete="off" size="5" />
        <span style="float:right; margin-right: 200px; display: flex; height: 1.8rem;">  
        <button type="submit" id="get_param_data" style="width:7rem">Get</button>
        <button type="submit" id="stream_param_data" style="margin-left: 10px; width:7rem;">Stream on</button>
        </span>
      </p>

    <hr style="border-style: double">

<script src = "./bundle.js" type = "module"> </script>
  </body>
</html>
